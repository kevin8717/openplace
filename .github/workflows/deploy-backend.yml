name: 部署后端到 Linux 服务器

on:
  push:
    branches:
      - v2.0
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
  workflow_dispatch:
    # 允许手动触发部署

jobs:
  deploy:
    name: 同步 src 到服务器
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 检出代码
        uses: actions/checkout@v4

      - name: 🔑 安装 SSH 密钥
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS || 'placeholder' }}
          if_key_exists: replace

      - name: 📝 配置 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: � 同步 src 文件夹到服务器（tar + ssh）
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "rm -rf ${{ secrets.SERVER_PATH }}/*"
          tar czf - -C ./src/ . | \
            ssh -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "tar xzf - -C ${{ secrets.SERVER_PATH }}"

      - name: � 重启 Docker 容器
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "docker restart openplace-app-1"
